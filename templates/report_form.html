{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>{{ 'Edit report' if report else 'New report' }}</h1><p class="muted">A report is owned by the signed-in user.</p></div></div><section class="card"><form method="post"><label>Title<input name="title" required value="{{report.title if report else ''}}"></label><div class="grid two"><label>Start date<input type="date" name="start_date" required value="{{report.start_date if report else ''}}"></label><label>End date<input type="date" name="end_date" required value="{{report.end_date if report else ''}}"></label></div><button class="button primary" type="submit">Create</button></form></section>{% endblock %}
